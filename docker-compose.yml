services:
  postgres:
    image: postgres:17-alpine
    container_name: outboxer-postgres
    environment: { POSTGRES_USER: outboxer, POSTGRES_PASSWORD: outboxer_local_dev, POSTGRES_DB: outboxer }
    ports: ["127.0.0.1:5437:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U outboxer -d outboxer"], interval: 2s, timeout: 3s, retries: 20 }
